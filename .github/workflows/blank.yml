name: Build Chicago Twins APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.10.2/bin" >> $GITHUB_PATH

      - name: Extract Project
        run: |
          mkdir project
          unzip -q Chicago_Twins_APK_Project.zip -d project

      - name: Build APK
        working-directory: project
        run: gradle assembleRelease --no-daemon

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Chicago-Twins-APK
          path: project/app/build/outputs/apk/release/app-release.apk
